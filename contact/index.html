<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-site-title data-page-title="Contact Lishaq Solutions | Let's Build Your Next Project"></title>

  <meta name="description" data-site-description
    data-page-description="Contact Lishaq Solutions for web development, AI automation, software development, UI/UX design, and custom business solutions. Get a free consultation today." />

  <meta name="robots" content="index,follow">

  <link rel="canonical" href="https://lishaqsolutions.com/contact/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url">
  <meta property="og:image" content="/images/og-image.jpg">
  <meta property="og:site_name">
  <meta property="og:locale" content="en_US">
  <meta property="og:image:alt" content="Lishaq Solutions">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="/images/og-image.jpg">
  <!-- Fonts -->
  <link rel="shortcut icon" href="/images/logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.min.css" />
</head>

<body>
  <!-- Dynamic Header -->
  <div id="header"></div>

  <!-- Hero Section -->
  <section class="hero" style="padding: 80px 0 50px">
    <div class="container" style="max-width: 780px">
      <span class="eyebrow">Get in touch</span>
      <h1>
        Tell us about your
        <span class="text-gradient">project</span>
      </h1>
      <p class="lead">
        Free quote within 24 hours. No pressure, no jargon — just a clear,
        honest plan.
      </p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="section" style="padding-top: 0">
    <div class="container grid" style="grid-template-columns: 2fr 3fr; gap: 30px">
      <!-- Contact Information -->
      <div style="display: flex; flex-direction: column; gap: 14px">
        <!-- WhatsApp -->
        <a href="https://wa.me/923151250978" class="card reveal" data-whatsapp-link
          style="display: flex; gap: 14px; align-items: flex-start">
          <div class="svc-icon" style="margin: 0; flex-shrink: 0">💬</div>
          <div>
            <div class="eyebrow" style="margin: 0">Fastest reply</div>
            <h3>WhatsApp</h3>
            <p class="muted" style="font-size: 0.9rem; margin-top: 4px" data-phone>
              +92 315 1250978
            </p>
          </div>
        </a>

        <!-- Email -->
        <a href="mailto:lishaqsolutions@gmail.com" class="card reveal" data-email-link
          style="display: flex; gap: 14px; align-items: flex-start">
          <div class="svc-icon" style="margin: 0; flex-shrink: 0">✉</div>
          <div>
            <div class="eyebrow" style="margin: 0">Email</div>
            <h3 data-email>lishaqsolutions@gmail.com</h3>
            <p class="muted" style="font-size: 0.9rem; margin-top: 4px">
              Reply within 24h
            </p>
          </div>
        </a>

        <!-- Working Hours -->
        <div class="card reveal">
          <p class="muted" style="font-size: 0.9rem">
            ⏱ Mon–Sat · 10:00–20:00 PKT
          </p>
          <p class="muted" style="font-size: 0.9rem; margin-top: 6px">
            📍 Working with clients worldwide
          </p>
        </div>
      </div>

      <!-- Contact Form -->
      <form id="contactForm" class="card reveal">
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required />
          </div>
        </div>

        <div class="form-group" style="margin-top: 18px">
          <label>Phone</label>
          <input type="text" name="phone" />
        </div>

        <div class="form-group" style="margin-top: 18px">
          <label>Tell us about your project or query</label>
          <textarea name="message" rows="6" required
            placeholder="What are you trying to build, fix, or improve?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 20px">
          📤 Send Message
        </button>

        <p id="formStatus"></p>
      </form>
    </div>
  </section>

  <!-- Dynamic Footer -->
  <div id="footer"></div>

  <!-- Floating WhatsApp Button -->
  <a data-whatsapp-link aria-label="WhatsApp Chat" target="_blank" rel="noopener noreferrer" class="wa-float">
    <i class="fab fa-whatsapp"></i>
    <span class="notification-dot"></span>
  </a>

  <!-- Scripts -->
  <script src="/js/components.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/dynamic.js"></script>
  <script src="/js/main.min.js"></script>

  <!-- Common schemas -->
  <script id="organization" type="application/ld+json"></script>
  <script id="website" type="application/ld+json"></script>

  <!-- Page-specific schema -->
  <script id="page-schema" type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ContactPage",
        "@id": "https://lishaqsolutions.com/contact/#webpage",
        "url": "https://lishaqsolutions.com/contact/",
        "name": "Contact | Lishaq Solutions",
        "description": "Get in touch with Lishaq Solutions for web development, AI automation, software development, UI/UX design, and custom digital solutions. Contact us via email, phone, or WhatsApp.",
        "isPartOf": {
          "@id": "https://lishaqsolutions.com/#website"
        },
        "about": {
          "@id": "https://lishaqsolutions.com/#organization"
        },
        "mainEntity": {
          "@id": "https://lishaqsolutions.com/#organization"
        }
      },
      {
        "@type": "BreadcrumbList",
        "@id": "https://lishaqsolutions.com/contact/#breadcrumb",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://lishaqsolutions.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Contact",
            "item": "https://lishaqsolutions.com/contact/"
          }
        ]
      }
    ]
  }
  </script>

  <script src="/js/schema.js"></script>

  <!-- Contact Form Submission -->
  <script>
    document
      .getElementById("contactForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();

        const form = this;
        const status = document.getElementById("formStatus");

        const formData = new FormData();
        formData.append("name", form.name.value);
        formData.append("email", form.email.value);
        formData.append("phone", form.phone.value);
        formData.append("message", form.message.value);

        status.textContent = "Sending...";

        try {
          await fetch(window.SITE_CONFIG.googleScript.contactForm, {
            method: "POST",
            body: formData,
            mode: "no-cors",
          });

          status.textContent = "Message sent successfully!";
          form.reset();
        } catch (error) {
          status.textContent = "Failed to send message.";
          console.error(error);
        }
      });
  </script>
</body>

</html>

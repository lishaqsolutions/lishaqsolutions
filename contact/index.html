<!DOCTYPE html>
<html lang="en" data-page-title="Contact"
  data-page-description="Get in touch with Lishaq Solutions. WhatsApp, email, or fill the form for a free quote within 24 hours."
  data-page-url="/contact/" data-page-og-title="Contact"
  data-page-og-description="Get in touch with Lishaq Solutions. WhatsApp, email, or fill the form for a free quote within 24 hours.">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Dynamic SEO -->
  <title>Contact — Lishaq Solutions</title>
  <meta name="description"
    content="Get in touch with Lishaq Solutions. WhatsApp, email, or fill the form for a free quote within 24 hours." />
  <meta name="author" content="Muhammad Ishaq" />
  <meta property="og:title" content="Contact — Lishaq Solutions" />
  <meta property="og:description"
    content="Get in touch with Lishaq Solutions. WhatsApp, email, or fill the form for a free quote within 24 hours." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Dynamic elements -->
  <link rel="shortcut icon" href="/lishaqsolutions/images/logo.png" type="image/x-icon" data-favicon />
  <link rel="canonical" href="/contact/" data-canonical />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/lishaqsolutions/css/styles.min.css" />
</head>

<body>
  <!-- Dynamic Header -->
  <div id="header"></div>

  <!-- Hero Section -->
  <section class="hero" style="padding: 80px 0 50px">
    <div class="container" style="max-width: 780px">
      <span class="eyebrow">Get in touch</span>
      <h1>
        Tell us about your
        <span class="text-gradient">project</span>
      </h1>
      <p class="lead">
        Free quote within 24 hours. No pressure, no jargon — just a clear,
        honest plan.
      </p>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="section" style="padding-top: 0">
    <div class="container grid" style="grid-template-columns: 2fr 3fr; gap: 30px">
      <!-- Contact Information -->
      <div style="display: flex; flex-direction: column; gap: 14px">
        <!-- WhatsApp -->
        <a href="https://wa.me/923151250978" class="card reveal" data-whatsapp-link
          style="display: flex; gap: 14px; align-items: flex-start">
          <div class="svc-icon" style="margin: 0; flex-shrink: 0">💬</div>
          <div>
            <div class="eyebrow" style="margin: 0">Fastest reply</div>
            <h3>WhatsApp</h3>
            <p class="muted" style="font-size: 0.9rem; margin-top: 4px" data-phone>
              +92 315 1250978
            </p>
          </div>
        </a>

        <!-- Email -->
        <a href="mailto:lishaqsolutions@gmail.com" class="card reveal" data-email-link
          style="display: flex; gap: 14px; align-items: flex-start">
          <div class="svc-icon" style="margin: 0; flex-shrink: 0">✉</div>
          <div>
            <div class="eyebrow" style="margin: 0">Email</div>
            <h3 data-email>lishaqsolutions@gmail.com</h3>
            <p class="muted" style="font-size: 0.9rem; margin-top: 4px">
              Reply within 24h
            </p>
          </div>
        </a>

        <!-- Working Hours -->
        <div class="card reveal">
          <p class="muted" style="font-size: 0.9rem">
            ⏱ Mon–Sat · 10:00–20:00 PKT
          </p>
          <p class="muted" style="font-size: 0.9rem; margin-top: 6px">
            📍 Working with clients worldwide
          </p>
        </div>
      </div>

      <!-- Contact Form -->
      <form id="contactForm" class="card reveal">
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required />
          </div>
        </div>

        <div class="form-group" style="margin-top: 18px">
          <label>Phone</label>
          <input type="text" name="phone" />
        </div>

        <div class="form-group" style="margin-top: 18px">
          <label>Tell us about your project or query</label>
          <textarea name="message" rows="6" required
            placeholder="What are you trying to build, fix, or improve?"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 20px">
          📤 Send Message
        </button>

        <p id="formStatus"></p>
      </form>
    </div>
  </section>

  <!-- Dynamic Footer -->
  <div id="footer"></div>

  <!-- Floating WhatsApp Button -->
  <a data-whatsapp-link aria-label="WhatsApp Chat" target="_blank" rel="noopener noreferrer" class="wa-float">
    <i class="fab fa-whatsapp"></i>
    <span class="notification-dot"></span>
  </a>

  <!-- Scripts -->
  <script src="/lishaqsolutions/js/components.js"></script>
  <script src="/lishaqsolutions/js/config.js"></script>
  <script src="/lishaqsolutions/js/dynamic.js"></script>
  <script src="/lishaqsolutions/js/main.min.js"></script>

  <!-- Contact Form Submission -->
  <script>
    document
      .getElementById("contactForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();

        const form = this;
        const status = document.getElementById("formStatus");

        const formData = new FormData();
        formData.append("name", form.name.value);
        formData.append("email", form.email.value);
        formData.append("phone", form.phone.value);
        formData.append("message", form.message.value);

        status.textContent = "Sending...";

        try {
          await fetch(window.SITE_CONFIG.googleScript.contactForm, {
            method: "POST",
            body: formData,
            mode: "no-cors",
          });

          status.textContent = "Message sent successfully!";
          form.reset();
        } catch (error) {
          status.textContent = "Failed to send message.";
          console.error(error);
        }
      });
  </script>
</body>

</html>
